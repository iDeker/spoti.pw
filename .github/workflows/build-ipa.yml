```yaml
name: Build IPA from Spotify Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag containing the decrypted Spotify IPA"
        required: true
        type: string
      ipa_asset:
        description: "IPA filename in the release"
        required: true
        type: string
        default: "spotify.ipa"

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Checkout spoti.pw
        uses: actions/checkout@v5

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout Theos
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages \
            git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download Spotify IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p ipa

          gh release download "${{ inputs.release_tag }}" \
            --pattern "${{ inputs.ipa_asset }}" \
            --dir ipa

          if [ ! -f "ipa/${{ inputs.ipa_asset }}" ]; then
            echo "::error::IPA was not downloaded"
            exit 1
          fi

          echo "Downloaded IPA:"
          ls -lh "ipa/${{ inputs.ipa_asset }}"

          echo "Checking IPA..."

          FILE_TYPE=$(file --mime-type -b "ipa/${{ inputs.ipa_asset }}")

          echo "MIME type: $FILE_TYPE"

          case "$FILE_TYPE" in
            application/zip|application/x-ios-app)
              echo "IPA check passed."
              ;;
            *)
              echo "::error::Downloaded file is not recognised as an IPA"
              exit 1
              ;;
          esac

      - name: Build
        run: make release

      - name: Upload built IPA
        uses: actions/upload-artifact@v5
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error
```
