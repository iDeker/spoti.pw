```yaml
name: Build IPA from Spotify Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag containing the decrypted Spotify IPA"
        required: true
        type: string
      ipa_asset:
        description: "IPA filename in the release"
        required: true
        type: string
        default: "spotify.ipa"

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Checkout spoti.pw
        uses: actions/checkout@v5

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout Theos
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages \
            git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Get release information
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -e

          gh release view "$TAG" \
            --json assets \
            --jq '.assets[] | "\(.name)\t\(.url)"' \
            > release-assets.txt

          echo "Release assets:"
          cat release-assets.txt

      - name: Download Spotify IPA
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          IPA_ASSET: ${{ inputs.ipa_asset }}
        run: |
          set -e

          mkdir -p ipa

          echo "Downloading $IPA_ASSET from release $TAG..."

          gh release download "$TAG" \
            --pattern "$IPA_ASSET" \
            --dir ipa

          if [ ! -f "ipa/$IPA_ASSET" ]; then
            echo "::error::Could not find ipa/$IPA_ASSET"
            exit 1
          fi

          echo "Downloaded:"
          ls -lh "ipa/$IPA_ASSET"

          echo "Checking IPA..."

          FILE_TYPE="$(file --mime-type -b "ipa/$IPA_ASSET")"
          echo "Detected MIME type: $FILE_TYPE"

          case "$FILE_TYPE" in
            application/zip|application/x-ios-app)
              echo "IPA looks valid."
              ;;
            *)
              echo "::error::Downloaded file is not recognised as an IPA"
              exit 1
              ;;
          esac

      - name: Build
        run: make release

      - name: Upload built IPA
        uses: actions/upload-artifact@v5
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error
```
